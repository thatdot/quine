quickQueries:
  - predicate:
      propertyKeys: []
      knownValues: {}
    quickQuery:
      name: Adjacent Nodes
      querySuffix: MATCH (n)--(m) RETURN DISTINCT m
      sort: NODE
  - predicate:
      propertyKeys: []
      knownValues: {}
    quickQuery:
      name: Refresh
      querySuffix: RETURN n
      sort: NODE
  - predicate:
      propertyKeys: []
      knownValues: {}
    quickQuery:
      name: Local Properties
      querySuffix: RETURN id(n), properties(n)
      sort: TEXT
  - predicate:
      dbLabel: IrcUser
      propertyKeys: []
      knownValues: {}
    quickQuery:
      name: Sent Messages
      querySuffix: MATCH (n)-[:SENT_MESSAGE]->(m:IrcMessage) RETURN m
      sort: NODE
  - predicate:
      dbLabel: IrcMessage
      propertyKeys: []
      knownValues: {}
    quickQuery:
      name: Mentioned Entities
      querySuffix: MATCH (n)-->(o) WHERE NOT ("IrcChannel" IN labels(o) OR "IrcServer" IN labels(o)) RETURN DISTINCT o
      sort: NODE

sampleQueries:
  - name: Messages that reference threat activity
    query: MATCH (m:IrcMessage) WHERE m.refersToThreatActivity = true RETURN m LIMIT 25
  - name: Messages still waiting for review by the chat model
    query: MATCH (m:IrcMessage) WHERE m.needsReview = true RETURN m LIMIT 25
  - name: Messages with extracted entities
    query: MATCH (m:IrcMessage)-->(o) WHERE NOT ("IrcChannel" IN labels(o) OR "IrcServer" IN labels(o)) RETURN m, o LIMIT 50

statusQuery:
  cypherQuery: >
    MATCH (m:IrcMessage)
    RETURN count(m) AS messages,
           sum(CASE WHEN m.refersToThreatActivity = true THEN 1 ELSE 0 END) AS threatMessages,
           sum(CASE WHEN m.needsReview = true THEN 1 ELSE 0 END) AS awaitingReview
