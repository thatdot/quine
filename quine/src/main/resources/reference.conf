include classpath("quine-pekko-overrides")

pekko {
  // This timeout controls the browsers timeout when waiting for API responses to return. The current value is arbitrary.
  http.server.request-timeout = 300 seconds

  // This timeout is used by the stream reading data for the S3 Ingest.
  http.client.stream-cancellation-delay = 10 seconds

  // All outbound connections like SSE ingest or webhook HTTP POST for standing query output all use a connection
  // from this pool. Pekko's own defaults (4 connections, 32 queued requests) sit below typical Quine default.
  // e.g. a "POST to HTTP[S] Webhook" output alone runs at parallelism 8, so the pool, rather than the user's
  // `parallelism` setting, ends up governing throughput. These values keep the pool out of the way of that knob.
  // Both limits are per host endpoint, and connections are opened on demand and dropped after
  // `idle-timeout`, so a workload talking to one slow endpoint costs nothing extra here.
  http.host-connection-pool {
    max-connections = 64

    // The pool's in-flight ceiling across all users of a given host. Requests beyond this limit fail
    // rather than queue, so it must stay well above max-connections. Pekko requires a power of 2.
    max-open-requests = 256
  }

  // SSE (Server-Sent Events) configuration for larger event payloads
  // These defaults can be overridden by user configuration
  http.sse {
    // Maximum size of a single SSE line (default in Pekko is 4096 bytes)
    max-line-size = 5242880  // 5 MB

    // Maximum size of a single SSE event (default in Pekko is 8192 bytes)
    // Must be larger than max-line-size
    max-event-size = 5242881  // 5 MB + 1 byte
  }

  coordinated-shutdown.exit-jvm = true
}

datastax-java-driver {
  advanced {
    connection {
      // NoNodeAvailableException is thrown when this is exceeded.
      // For more info, see:
      // https://community.datastax.com/questions/5204/approaches-to-accommodating-the-1024-connection-li.html
      max-requests-per-connection = 50000
    }
    metrics {
      session.enabled = [cql-requests, bytes-sent, bytes-received]
      node.enabled = [pool.available-streams, pool.in-flight]
    }
  }
}
