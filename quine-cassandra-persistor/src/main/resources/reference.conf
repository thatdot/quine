// Default configuration for the DataStax Java driver used by the Cassandra persistor.
//
// This lives in the persistor module (rather than an application's reference.conf) so that any build
// depending on the Cassandra persistor -- OSS Quine, Enterprise, Novelty -- picks it up automatically,
// independent of whether that app also depends on the OSS front-end. The repo's `appendProjectsLast`
// assembly merge strategy concatenates our project reference.confs after library ones, so these values
// reliably override the driver's own reference.conf defaults.
datastax-java-driver {
  advanced {
    connection {
      // Raised from the driver default of 1024 so a burst of concurrent requests does not exhaust
      // the per-connection stream ids and surface as NoNodeAvailableException. For background:
      // https://community.datastax.com/questions/5204/approaches-to-accommodating-the-1024-connection-li.html
      //
      // The driver requires this to be under 32768 (the protocol's stream-id ceiling), so it cannot
      // serve as a global throughput bound -- the driver's own documentation directs you to a request
      // throttler for that, which is configured below.
      max-requests-per-connection = 32767
    }
    // Client-side request throttling. This bounds the number of requests the driver will hold
    // concurrently and gives us a typed, fast-fail signal (RequestThrottlingException) when that bound
    // is exceeded, instead of silently queueing then timing out. It is the store-side half of the
    // write-storm defense: the shard caps how many nodes sleep at once during shutdown
    // (GraphShardActor.ShutdownMaxConcurrentSleeps), and these limits catch whatever still gets through,
    // keeping the driver's internal queue bounded so excess work fast-fails rather than growing memory
    // without bound. Tune against real deployments.
    throttler {
      class = ConcurrencyLimitingRequestThrottler
      max-concurrent-requests = 8192
      max-queue-size = 8192
    }
    metrics {
      session.enabled = [cql-requests, bytes-sent, bytes-received]
      node.enabled = [pool.available-streams, pool.in-flight]
    }
  }
}
